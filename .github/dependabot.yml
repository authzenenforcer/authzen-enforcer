version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for all Maven updates, so the version properties in pom.xml do not conflict
      maven:
        patterns: ["*"]
    ignore:
      # Integrations compile against the oldest supported line; only patch updates apply
      - dependency-name: "io.micrometer:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.opentelemetry:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The SLF4J binding of the interop tests follows the SLF4J API that Testcontainers brings
      - dependency-name: "org.slf4j:slf4j-simple"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # The Keycloak image of the interop tests; KeycloakPdp reads it from compose.yaml
  - package-ecosystem: docker-compose
    directory: /authzen-enforcer-interop-tests
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
