name: Feature request
description: Propose a new feature or a change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Larger ideas can start in [Discussions](https://github.com/authzenenforcer/authzen-enforcer/discussions/categories/ideas)
        first. Please check the [open issues](https://github.com/authzenenforcer/authzen-enforcer/issues) for an existing one.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work, for example the API, the configuration or the behavior.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other designs you considered.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this.
