name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so that a new Micrometer, OpenTelemetry or Spring Boot release that breaks the modules shows up
  # even when no pull request is open
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21, 25]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify

  micrometer-latest:
    # The module compiles against the oldest supported Micrometer; this checks the newest release
    name: Micrometer (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Find the latest Micrometer release
        id: micrometer
        run: |
          version=$(curl -fsS https://repo.maven.apache.org/maven2/io/micrometer/micrometer-core/maven-metadata.xml \
            | grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -n 1)
          test -n "$version"
          echo "Micrometer $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test with the latest Micrometer
        run: mvn -B -ntp -pl authzen-enforcer-micrometer -am verify -Dmicrometer.version=${{ steps.micrometer.outputs.version }}

  opentelemetry-latest:
    # The module compiles against the oldest supported OpenTelemetry; this checks the newest release
    name: OpenTelemetry (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Find the latest OpenTelemetry release
        id: opentelemetry
        run: |
          version=$(curl -fsS https://repo.maven.apache.org/maven2/io/opentelemetry/opentelemetry-api/maven-metadata.xml \
            | grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -n 1)
          test -n "$version"
          echo "OpenTelemetry $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test with the latest OpenTelemetry
        run: mvn -B -ntp -pl authzen-enforcer-opentelemetry -am verify -Dopentelemetry.version=${{ steps.opentelemetry.outputs.version }}

  spring-boot-latest:
    # The starter compiles against the oldest supported Spring Boot; this checks the newest release
    name: Spring Boot (latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Find the latest Spring Boot release
        id: spring-boot
        run: |
          version=$(curl -fsS https://repo.maven.apache.org/maven2/org/springframework/boot/spring-boot-dependencies/maven-metadata.xml \
            | grep -oE '<version>[0-9]+\.[0-9]+\.[0-9]+</version>' | sed -E 's/<\/?version>//g' | sort -V | tail -n 1)
          test -n "$version"
          echo "Spring Boot $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test with the latest Spring Boot
        run: mvn -B -ntp -pl authzen-enforcer-spring-boot-starter -am verify -Dspring-boot.version=${{ steps.spring-boot.outputs.version }}

  interop:
    name: Interop (Keycloak)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Run interop tests
        run: mvn -B -ntp -pl authzen-enforcer-interop-tests -am verify -Dinterop.skip=false

  analysis:
    name: Analysis (SonarQube Cloud)
    runs-on: ubuntu-latest
    env:
      # Not available to pull requests from forks and Dependabot; the analysis is skipped there
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history for blame information and new code detection
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build, test with coverage and analyze
        if: env.SONAR_TOKEN != ''
        run: >
          mvn -B -ntp verify sonar:sonar
          -Dinterop.skip=false
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=authzenenforcer
