name: Release

# Push a tag such as v0.1.0 to publish that version to Maven Central.
# The deployment is uploaded and validated, then waits for manual publishing in the Central Portal.
# A draft GitHub Release with the signed aggregate SBOM is created for the tag, to be published
# afterwards.
#
# Run the workflow by hand, on any branch or tag, for a dry run: it builds the release artifacts
# and SBOMs without signing, publishing or a GitHub Release, and keeps the SBOMs as workflow
# artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
          # A dry run signs nothing, so it does not get the key
          gpg-private-key: ${{ github.event_name == 'push' && secrets.GPG_PRIVATE_KEY || '' }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE
      - name: Set version from tag
        if: github.event_name == 'push'
        run: mvn -B -ntp versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Deploy to Maven Central
        if: github.event_name == 'push'
        run: mvn -B -ntp -P release deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Build the release artifacts (dry run)
        if: github.event_name != 'push'
        run: .github/scripts/mvn-retry.sh -B -ntp -P release -Dgpg.skip verify
      - name: Aggregate SBOM of the published modules
        run: |
          version=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          .github/scripts/mvn-retry.sh -B -ntp org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom \
            -Dcyclonedx.skipAttach=true -DoutputReactorProjects=false \
            -DoutputDirectory="$RUNNER_TEMP/sbom" -DoutputName="authzen-enforcer-$version-cyclonedx"
      - name: Sign the aggregate SBOM
        if: github.event_name == 'push'
        run: |
          for file in "$RUNNER_TEMP"/sbom/*; do
            printf '%s' "$MAVEN_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign "$file"
          done
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Keep the aggregate SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ${{ runner.temp }}/sbom/
          if-no-files-found: error
      - name: Keep the module SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: module-sboms
          path: |
            */target/bom.json
            */target/bom.xml
          if-no-files-found: error

  github-release:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
      - name: Create a draft GitHub Release with the aggregate SBOM
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "authzen-enforcer ${GITHUB_REF_NAME#v}" \
            --notes "Draft: add the notes, then publish once the deployment is published in the Central Portal." \
            "authzen-enforcer-${GITHUB_REF_NAME#v}-cyclonedx.json" \
            "authzen-enforcer-${GITHUB_REF_NAME#v}-cyclonedx.json.asc" \
            "authzen-enforcer-${GITHUB_REF_NAME#v}-cyclonedx.xml" \
            "authzen-enforcer-${GITHUB_REF_NAME#v}-cyclonedx.xml.asc"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
